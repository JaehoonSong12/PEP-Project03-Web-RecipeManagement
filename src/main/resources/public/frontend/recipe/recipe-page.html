<!-- 
 This file contains the structure for the main recipe management page of the Recipe Management Application.
 It provides interfaces for viewing, adding, updating, deleting, and searching recipes.
 Admin users are also provided a link to the Ingredients management page.
 Cross-Reference: See Section 3 "Recipe Management" in docs/sys_doc.tex
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes - Recipe Management App</title>
    <link rel="stylesheet" href="recipe-page.css">
</head>

<body>

    <!-- TODO: Add a hidden link with id="admin-link" to navigate to the ingredients page (admin only) -->
    <!-- 
      Admin-only navigation link to the Ingredients Management page.
      Visible only if `is-admin` is true in sessionStorage.
      Cross-Reference: See Section 4 "Ingredient Management" in docs/sys_doc.tex
    -->
    <a href="../ingredients/ingredient-page.html" id="admin-link" style="display: none;">Ingredients (Admin)</a>

    <!-- TODO: Add a hidden Logout button with id="logout-button" -->
    <!-- 
      Logout button to invalidate the current session token.
      Cross-Reference: See Section 2.2 "User Login and Logout" in docs/sys_doc.tex
    -->
    <button id="logout-button" style="display: none;">Logout</button>

    <!-- TODO: Add an h1 heading for the Recipe Management section -->
    <h1>Recipes Management</h1>


    <!-- 🔍 Search a Recipe -->
    <!-- 
        TODO: 
        - Create an h2 with text "Search a Recipe"
        - Add input with id="search-input"
        - Add button with id="search-button" and text "Search"
    -->
    <!-- 
      Search section allowing users to filter recipes by name or ingredient.
      Cross-Reference: See Section 3.2 "Retrieve Recipes" in docs/sys_doc.tex
    -->
    <h2>Search a Recipe</h2>
    <input id="search-input" type="text" placeholder="Search term..." />
    <button id="search-button">Search</button>


    <!-- 📋 Recipe List -->
    <!-- 
        TODO: 
        - Create a <ul> to hold all recipes
        - Give it id="recipe-list"
    -->
    <!-- 
      Container for rendering the list of fetched recipes.
    -->
    <ul id="recipe-list"></ul>


    <!-- ➕ Add a Recipe -->
    <!-- 
        TODO: 
        - h2 with "Add a Recipe"
        - Input for recipe name (id="add-recipe-name-input")
        - Textarea for instructions (id="add-recipe-instructions-input")
        - Button to submit (id="add-recipe-submit-input") with text "Add Recipe"
    -->
    <!-- 
      Form to submit a new recipe.
      Cross-Reference: See Section 3.1 "Create Recipe" in docs/sys_doc.tex
    -->
    <h2>Add a Recipe</h2>
    <input id="add-recipe-name-input" type="text" placeholder="Recipe Name" />
    <textarea id="add-recipe-instructions-input" placeholder="Instructions"></textarea>
    <button id="add-recipe-submit-input">Add Recipe</button>


    <!-- ✏️ Update a Recipe -->
    <!-- 
        TODO:
        - h2 with "Update a Recipe"
        - Input for recipe name (id="update-recipe-name-input")
        - Textarea for updated instructions (id="update-recipe-instructions-input")
        - Button (id="update-recipe-submit-input") with text "Update Recipe"
    -->
    <!-- 
      Form to update an existing recipe's instructions by its name.
      Cross-Reference: See Section 3.4 "Update Recipe" in docs/sys_doc.tex
    -->
    <h2>Update a Recipe</h2>
    <input id="update-recipe-name-input" type="text" placeholder="Recipe Name" />
    <textarea id="update-recipe-instructions-input" placeholder="Updated Instructions"></textarea>
    <button id="update-recipe-submit-input">Update Recipe</button>


    <!-- ❌ Delete a Recipe -->
    <!-- 
        TODO:
        - h2 with "Delete a Recipe"
        - Input with id="delete-recipe-name-input"
        - Button with id="delete-recipe-submit-input" and text "Delete Recipe"
    -->
    <!-- 
      Form to delete an existing recipe by its name.
      Cross-Reference: See Section 3.5 "Delete Recipe" in docs/sys_doc.tex
    -->
    <h2>Delete a Recipe</h2>
    <input id="delete-recipe-name-input" type="text" placeholder="Recipe Name" />
    <button id="delete-recipe-submit-input">Delete Recipe</button>

    <script src="recipe-page.js"></script>
</body>

</html>
