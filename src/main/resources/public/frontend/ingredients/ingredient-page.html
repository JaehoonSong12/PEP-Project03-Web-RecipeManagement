 This file contains the structure for the ingredient management page of the Recipe Management Application.
 Cross-Reference: See Section 4 "Ingredient Management" in docs/sys_doc.tex
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredients - Recipe Management App</title>
    <link rel="stylesheet" href="ingredient-page.css">
</head>
<body>

    <!-- TODO: Create a link back to the recipe page with an id of "back-link" -->
    <!-- 
      Navigation link to return to the main recipe page.
    -->
    <a href="../recipe/recipe-page.html" id="back-link">Back to Recipes</a>

    <!-- TODO: Create a heading for the page -->
    <!-- Header indicating the purpose of the page -->
    <h1>Ingredient Management</h1>

    <!-- TODO: Create a section to display the list of ingredients -->
    <!-- - Include an h2 titled "Ingredients" -->
    <!-- - Include a <ul> with id "ingredient-list" -->
    <!-- 
      Container for rendering the list of fetched ingredients.
      Cross-Reference: See Section 4.2 "Retrieve Ingredients" in docs/sys_doc.tex
    -->
    <h2>Ingredients</h2>
    <ul id="ingredient-list"></ul>

    <!-- TODO: Create a section to add a new ingredient -->
    <!-- - Include an h2 titled "Add an Ingredient" -->
    <!-- - Include an input field with id "add-ingredient-name-input" -->
    <!-- - Include a button with id "add-ingredient-submit-button" -->
    <!-- 
      Form to submit a new ingredient.
      Cross-Reference: See Section 4.1 "Create Ingredient" in docs/sys_doc.tex
    -->
    <h2>Add an Ingredient</h2>
    <input id="add-ingredient-name-input" type="text" placeholder="Ingredient Name" />
    <button id="add-ingredient-submit-button">Add Ingredient</button>

    <!-- TODO: Create a section to delete an ingredient -->
    <!-- - Include an h2 titled "Delete an Ingredient" -->
    <!-- - Include an input field with id "delete-ingredient-name-input" -->
    <!-- - Include a button with id "delete-ingredient-submit-button" -->
    <!-- 
      Form to delete an existing ingredient by its name.
      Cross-Reference: See Section 4.5 "Delete Ingredient" in docs/sys_doc.tex
    -->
    <h2>Delete an Ingredient</h2>
    <input id="delete-ingredient-name-input" type="text" placeholder="Ingredient Name" />
    <button id="delete-ingredient-submit-button">Delete Ingredient</button>

    <script src="ingredient-page.js"></script>
</body>
</html>
